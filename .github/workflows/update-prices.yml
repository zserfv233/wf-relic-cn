name: Update market prices

on:
  schedule:
    - cron: '17 */6 * * *'   # 每 6 小时（UTC）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Fetch warframe.market prices (<=3 req/s, circuit breaker on repeated failures)
        # 失败（含被 Cloudflare 拦截）时脚本以非零退出，后续步骤不会执行，现有 data/prices.json 不会被提交覆盖
        run: node scripts/fetch-prices.mjs --max-age-hours 5

      - name: Run tests
        run: npm test

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/meta.json
          git commit -m "chore(data): update market prices [skip ci]"
          git push
