name: Update drop tables (DE / WFCD)

on:
  schedule:
    - cron: '43 2 * * *'   # 每天 UTC 02:43
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Download raw sources and rebuild data/
        # 原始数据放在 runner 临时目录，不进仓库；价格覆盖率由 build-data 基于现有 data/prices.json 重新计算
        run: node scripts/build-data.mjs --download --raw "$RUNNER_TEMP/wf-raw"

      - name: Run tests (must pass before committing)
        run: npm test

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore(data): rebuild drop tables [skip ci]"
          git push
